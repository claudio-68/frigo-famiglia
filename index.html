<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Frigo Famiglia</title>

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
            background: white;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 40px;
        }

        h2 {
            margin-bottom: 25px;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        #risultato {
            margin-top: 30px;
            font-size: 22px;
        }

        #codice {
            font-size: 26px;
            font-weight: bold;
            margin-top: 10px;
            word-break: break-all;
        }

        #prodotto {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background: #f2f2f2;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        #prodotto img {
            max-width: 220px;
            max-height: 220px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .nome-prodotto {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }

        .marca {
            font-size: 20px;
            margin-top: 12px;
        }

        .caricamento {
            font-size: 20px;
            margin-top: 10px;
        }

        .errore {
            color: #c62828;
            font-weight: bold;
            font-size: 20px;
        }

        .successo {
            color: #2e7d32;
            font-weight: bold;
            font-size: 20px;
        }

        .debug {
            margin-top: 20px;
            padding: 15px;
            background: #eeeeee;
            border-radius: 10px;
            font-size: 14px;
            text-align: left;
            word-break: break-word;
        }

    </style>

</head>


<body>


    <h1>🥶 Frigo Famiglia</h1>


    <h2>📷 Inquadra il codice a barre</h2>


    <!--
        TELECAMERA / SCANNER
    -->

    <div id="reader"></div>


    <!--
        CODICE LETTO
    -->

    <div id="risultato">

        <h2>✅ Codice trovato:</h2>

        <div id="codice"></div>

    </div>


    <!--
        RISULTATO PRODOTTO
    -->

    <div id="prodotto"></div>


    <script>


        /*
        ==================================================
        SCANNER
        ==================================================
        */

        const scanner =
            new Html5Qrcode("reader");


        /*
        ==================================================
        QUANDO VIENE LETTO IL CODICE
        ==================================================
        */

        function codiceLetto(decodedText, decodedResult) {

            console.log(
                "CODICE LETTO:",
                decodedText
            );


            /*
            Mostriamo il codice
            */

            document.getElementById("codice")
                .innerText = decodedText;


            /*
            ==================================================
            DIAGNOSTICA
            ==================================================
            */

            document.getElementById("prodotto").innerHTML =

                "<h2>🔎 Codice ricevuto</h2>" +

                "<p><strong>" +
                decodedText +
                "</strong></p>" +

                "<p>⏳ Sto preparando la ricerca...</p>";


            /*
            ==================================================
            POPUP DI TEST
            ==================================================
            */

            alert(
                "Sto cercando il prodotto: " +
                decodedText
            );


            /*
            ==================================================
            FERMIAMO LO SCANNER
            ==================================================
            */

            scanner.clear()

                .then(() => {

                    console.log(
                        "Scanner fermato"
                    );

                })

                .catch((errore) => {

                    console.error(
                        "Errore arresto scanner:",
                        errore
                    );

                });


            /*
            ==================================================
            CERCHIAMO IL PRODOTTO
            ==================================================
            */

            cercaProdotto(decodedText);

        }


        /*
        ==================================================
        CERCA PRODOTTO SU OPEN FOOD FACTS
        ==================================================
        */

        async function cercaProdotto(codice) {


            const contenitore =
                document.getElementById("prodotto");


            /*
            Messaggio di caricamento
            */

            contenitore.innerHTML =

                '<div class="caricamento">' +

                '🔎 Cerco il prodotto su Open Food Facts...' +

                '<br><br>' +

                'Codice: ' +

                codice +

                '</div>';


            try {


                /*
                ==================================================
                URL API
                ==================================================
                */

                const url =

                    "https://world.openfoodfacts.org/api/v2/product/" +

                    encodeURIComponent(codice) +

                    "?fields=" +

                    "code," +

                    "product_name," +

                    "product_name_it," +

                    "brands," +

                    "quantity," +

                    "categories," +

                    "ingredients_text," +

                    "image_front_url";


                console.log(
                    "CHIAMATA API:",
                    url
                );


                /*
                Mostriamo la chiamata
                */

                contenitore.innerHTML =

                    '<div class="caricamento">' +

                    '🌐 Contatto Open Food Facts...' +

                    '<br><br>' +

                    'Codice: ' +

                    codice +

                    '<br><br>' +

                    'Attendere...'

                    + '</div>';


                /*
                ==================================================
                FETCH
                ==================================================
                */

                const risposta =
                    await fetch(url);


                console.log(
                    "RISPOSTA HTTP:",
                    risposta.status
                );


                /*
                ==================================================
                CONTROLLO HTTP
                ==================================================
                */

                if (!risposta.ok) {

                    throw new Error(
                        "Errore HTTP: " +
                        risposta.status
                    );

                }


                /*
                ==================================================
                CONVERTIAMO IN JSON
                ==================================================
                */

                const dati =
                    await risposta.json();


                console.log(
                    "DATI RICEVUTI:",
                    dati
                );


                /*
                ==================================================
                MOSTRIAMO DATI DIAGNOSTICI
                ==================================================
                */

                console.log(
                    "STATUS PRODOTTO:",
                    dati.status
                );


                /*
                ==================================================
                CONTROLLO PRODOTTO
                ==================================================
                */

                if (
                    dati.status !== 1 ||
                    !dati.product
                ) {


                    contenitore.innerHTML =

                        '<div class="errore">' +

                        '❌ Prodotto non trovato' +

                        '<br><br>' +

                        'Il codice è stato letto correttamente.' +

                        '<br><br>' +

                        'Codice: ' +

                        codice +

                        '</div>' +

                        '<div class="debug">' +

                        '<strong>🔧 Diagnostica</strong>' +

                        '<br><br>' +

                        'Open Food Facts ha risposto correttamente,' +

                        '<br>' +

                        'ma non ha trovato questo codice nel database.' +

                        '<br><br>' +

                        'HTTP: ' +

                        risposta.status +

                        '<br>' +

                        'Status prodotto: ' +

                        dati.status +

                        '</div>';


                    return;

                }


                /*
                ==================================================
                PRODOTTO TROVATO
                ==================================================
                */

                const prodotto =
                    dati.product;


                console.log(
                    "PRODOTTO:",
                    prodotto
                );


                /*
                ==================================================
                NOME
                ==================================================
                */

                const nome =

                    prodotto.product_name_it ||

                    prodotto.product_name ||

                    "Nome non disponibile";


                /*
                ==================================================
                MARCA
                ==================================================
                */

                const marca =

                    prodotto.brands ||

                    "Marca non disponibile";


                /*
                ==================================================
                QUANTITÀ
                ==================================================
                */

                const quantita =

                    prodotto.quantity ||

                    "Quantità non disponibile";


                /*
                ==================================================
                CATEGORIA
                ==================================================
                */

                const categoria =

                    prodotto.categories ||

                    "Categoria non disponibile";


                /*
                ==================================================
                INGREDIENTI
                ==================================================
                */

                const ingredienti =

                    prodotto.ingredients_text ||

                    "Ingredienti non disponibili";


                /*
                ==================================================
                IMMAGINE
                ==================================================
                */

                const immagine =

                    prodotto.image_front_url ||

                    "";


                /*
                ==================================================
                CREIAMO HTML
                ==================================================
                */

                let html = "";


                /*
                ==================================================
                TITOLO
                ==================================================
                */

                html +=

                    '<div class="successo">' +

                    '✅ PRODOTTO TROVATO!' +

                    '</div>';


                /*
                ==================================================
                NOME
                ==================================================
                */

                html +=

                    '<div class="nome-prodotto">' +

                    '🛒 ' +

                    nome +

                    '</div>';


                /*
                ==================================================
                MARCA
                ==================================================
                */

                html +=

                    '<div class="marca">' +

                    '🏷️ ' +

                    marca +

                    '</div>';


                /*
                ==================================================
                QUANTITÀ
                ==================================================
                */

                html +=

                    '<div class="marca">' +

                    '📦 Quantità: ' +

                    quantita +

                    '</div>';


                /*
                ==================================================
                CATEGORIA
                ==================================================
                */

                html +=

                    '<div class="marca">' +

                    '🥫 Categoria: ' +

                    categoria +

                    '</div>';
