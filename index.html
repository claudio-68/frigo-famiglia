<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Frigo Famiglia</title>

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>


    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
            background: white;
        }


        h1 {
            font-size: 42px;
            margin-bottom: 40px;
        }


        h2 {
            margin-bottom: 25px;
        }


        #reader {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }


        #risultato {
            margin-top: 30px;
            font-size: 22px;
        }


        #codice {
            font-size: 26px;
            font-weight: bold;
            margin-top: 10px;
            word-break: break-all;
        }


        #prodotto {

            margin-top: 30px;

            padding: 25px;

            border-radius: 15px;

            background: #f2f2f2;

            max-width: 500px;

            margin-left: auto;

            margin-right: auto;
        }


        #prodotto img {

            max-width: 220px;

            max-height: 220px;

            border-radius: 10px;

            margin-top: 20px;
        }


        .nome-prodotto {

            font-size: 28px;

            font-weight: bold;

            margin-top: 10px;
        }


        .marca {

            font-size: 20px;

            margin-top: 12px;
        }


        .caricamento {

            font-size: 20px;

            margin-top: 10px;
        }


        .errore {

            color: #c62828;

            font-weight: bold;

            font-size: 20px;
        }


        .successo {

            color: #2e7d32;

            font-weight: bold;

            font-size: 20px;
        }

    </style>

</head>


<body>


    <h1>🥶 Frigo Famiglia</h1>


    <h2>📷 Inquadra il codice a barre</h2>


    <!--
        Qui viene visualizzata
        la fotocamera
    -->

    <div id="reader"></div>


    <!--
        Qui mostriamo
        il codice letto
    -->

    <div id="risultato">

        <h2>✅ Codice trovato:</h2>

        <div id="codice"></div>

    </div>


    <!--
        Qui mostreremo
        il prodotto trovato
    -->

    <div id="prodotto"></div>



    <script>


        /*
        ==================================================
        VARIABILE DELLO SCANNER
        ==================================================
        */

        const scanner =
            new Html5Qrcode("reader");



        /*
        ==================================================
        QUANDO VIENE LETTO IL CODICE
        ==================================================
        */

        function codiceLetto(decodedText, decodedResult) {


            console.log(
                "Codice letto:",
                decodedText
            );


            /*
            Mostriamo il codice
            */

            document.getElementById("codice")
                .innerText = decodedText;


            /*
            Fermiamo lo scanner
            */

            scanner.clear()
                .then(() => {

                    console.log(
                        "Scanner fermato"
                    );

                })
                .catch((errore) => {

                    console.error(
                        "Errore arresto scanner:",
                        errore
                    );

                });


            /*
            Cerchiamo il prodotto
            */

            cercaProdotto(decodedText);

        }



        /*
        ==================================================
        CERCA PRODOTTO
        ==================================================
        */

        async function cercaProdotto(codice) {


            const contenitore =
                document.getElementById("prodotto");


            /*
            Mostriamo messaggio
            */

            contenitore.innerHTML =
                '<div class="caricamento">' +
                '🔎 Cerco il prodotto...' +
                '</div>';


            try {


                /*
                URL DELLA API OPEN FOOD FACTS
                */

                const url =
                    "https://world.openfoodfacts.org/api/v2/product/" +
                    codice +
                    "?fields=product_name,product_name_it,brands,image_front_url";


                console.log(
                    "Chiamata API:",
                    url
                );


                /*
                Facciamo la richiesta
                */

                const risposta =
                    await fetch(url);


                console.log(
                    "HTTP:",
                    risposta.status
                );


                /*
                Controlliamo la risposta
                */

                if (!risposta.ok) {

                    throw new Error(
                        "HTTP " +
                        risposta.status
                    );

                }


                /*
                Convertiamo la risposta
                in JSON
                */

                const dati =
                    await risposta.json();


                console.log(
                    "DATI RICEVUTI:",
                    dati
                );


                /*
                ==================================================
                CONTROLLO PRODOTTO
                ==================================================
                */


                if (
                    dati.status !== 1 ||
                    !dati.product
                ) {


                    contenitore.innerHTML =

                        '<div class="errore">' +

                        '❌ Prodotto non trovato' +

                        '<br><br>' +

                        'Il codice è stato letto correttamente.' +

                        '<br><br>' +

                        'Codice: ' +

                        codice +

                        '</div>';


                    return;

                }



                /*
                ==================================================
                PRODOTTO TROVATO
                ==================================================
                */


                const prodotto =
                    dati.product;



                /*
                Nome prodotto
                */

                const nome =

                    prodotto.product_name_it ||

                    prodotto.product_name ||

                    "Nome non disponibile";



                /*
                Marca
                */

                const marca =

                    prodotto.brands ||

                    "Marca non disponibile";



                /*
                Immagine
                */

                const immagine =

                    prodotto.image_front_url ||

                    "";



                /*
                ==================================================
                CREIAMO LA VISUALIZZAZIONE
                ==================================================
                */


                let html = "";


                /*
                Nome
                */

                html +=

                    '<div class="nome-prodotto">' +

                    '🛒 ' +

                    nome +

                    '</div>';


                /*
                Marca
                */

                html +=

                    '<div class="marca">' +

                    '🏷️ ' +

                    marca +

                    '</div>';


                /*
                Codice
                */

                html +=

                    '<div style="margin-top:15px;">' +

                    '🔢 Codice: ' +

                    codice +

                    '</div>';


                /*
                Immagine
                */

                if (immagine) {

                    html +=

                        '<img src="' +

                        immagine +

                        '" ' +

                        'alt="Immagine prodotto">';

                }


                /*
                Inseriamo tutto
                nella pagina
                */

                contenitore.innerHTML = html;


            }


            catch (errore) {


                console.error(
                    "ERRORE API:",
                    errore
                );


                contenitore.innerHTML =

                    '<div class="errore">' +

                    '⚠️ Errore nel collegamento al database' +

                    '<br><br>' +

                    errore.message +

                    '</div>';

            }

        }



        /*
        ==================================================
        CONFIGURAZIONE SCANNER
        ==================================================
        */

        const configurazione = {


            fps: 10,


            qrbox: {

                width: 300,

                height: 150

            },


            aspectRatio: 1.777778

        };



        /*
        ==================================================
        AVVIAMO LA FOTOCAMERA
        ==================================================
        */

        scanner.start(

            {
                facingMode: "environment"
            },


            configurazione,


            codiceLetto,


            function (errore) {

                /*
                Gli errori normali
                durante la scansione
                non vengono mostrati
                */

            }

        )


        .then(() => {

            console.log(
                "Scanner avviato correttamente"
            );

        })


        .catch((errore) => {


            console.error(
                "Errore avvio fotocamera:",
                errore
            );


            document.getElementById(
                "reader"
            ).innerHTML =

                '<div class="errore">' +

                '❌ Impossibile avviare la fotocamera.' +

                '<br><br>' +

                errore +

                '</div>';

        });


    </script>


</body>

</html>
