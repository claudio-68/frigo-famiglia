    <script>


        /*
        ==================================================
        CONFIGURAZIONE SUPABASE
        ==================================================
        */

        const SUPABASE_URL =
            "https://gfoukzgadjidvamoeslm.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_s97FpTxFjeap3_pEHIytIg_DY0FtVvq";


        const SUPABASE_TABELLA =
            "prodotti_frigo";


        /*
        ==================================================
        TELEGRAM
        ==================================================
        */

        const TELEGRAM_WORKER =
            "https://frigo-telegram.ilclait.workers.dev";


        const TELEGRAM_CHAT_ID =

        /*
        ==================================================
        SCANNER
        ==================================================
        */

        let scanner = null;

        let scansioneInCorso = false;

        let codiceGiaLetto = false;


        /*
        ==================================================
        FRIGO
        ==================================================

        Ora il frigo viene caricato da Supabase.

        ==================================================
        */

        let frigo = [];


        /*
        ==================================================
        FUNZIONE API SUPABASE
        ==================================================
        */

        async function supabaseFetch(
            endpoint,
            options = {}
        ) {


            const headers = {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                "Content-Type":
                    "application/json",

                ...(options.headers || {})

            };


            const risposta =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/" +
                    endpoint,

                    {

                        ...options,

                        headers:
                            headers

                    }

                );


            if (!risposta.ok) {

                const testo =
                    await risposta.text();

                throw new Error(

                    "Supabase HTTP " +
                    risposta.status +
                    ": " +
                    testo

                );

            }


            if (
                risposta.status ===
                204
            ) {

                return null;

            }


            return await risposta.json();

        }


        /*
        ==================================================
        STATO DATABASE
        ==================================================
        */

        function statoDatabase(
            testo,
            online = true
        ) {


            const elemento =
                document.getElementById(

                );


            elemento.innerText =

            elemento.className =

        }


        /*

                                categoria:

                                immagine:
                                    prodotto.immagine || "",

                                quantitaFrigo:

                                        prodotto.quantita_frigo

                );

                );

        /*

        async function sincronizzaFrigo() {

        /*
        ==================================================
        SALVA FRIGO

        Non usiamo più localStorage come database.

        ==================================================
        */

        function salvaFrigo() {

            /*
            La funzione rimane per compatibilità
            con il vecchio codice.

            Il database vero è Supabase.
            */

        }


        /*
        ==================================================
        STATO SCADENZA
        ==================================================
        */

        function statoScadenza(data) {


            if (!data) {

                return {

                    classe:
                        "scadenza-nessuna",

                    testo:
                        "📅 Scadenza: non inserita"

                };

            }


            const oggi =
                new Date();


            oggi.setHours(
                0,
                0,
                0,
                0
            );


            const scadenza =
                new Date(
                    data + "T00:00:00"
                );


            const differenza =
                Math.ceil(

                    (
                        scadenza -
                        oggi
                    )
                    /
                    (
                        1000 *
                        60 *
                        60 *
                        24
                    )

                );


            if (differenza < 0) {

                return {

                    classe:
                        "scadenza-rossa",

                    testo:
                        "🔴 Scaduto: " +
                        formattaData(data)

                };

            }


            if (differenza === 0) {

                return {

                    classe:
                        "scadenza-rossa",

                    testo:
                        "🔴 Scade oggi"

                };

            }


            if (differenza <= 3) {

                return {

                    classe:
                        "scadenza-arancio",

                    testo:
                        "🟠 Scade tra " +
                        differenza +
                        " giorni: " +
                        formattaData(data)

                };

            }


            return {

                classe:
                    "scadenza-verde",

                testo:
                    "🟢 Scadenza: " +
                    formattaData(data)

            };

        }


        /*
        ==================================================
        FORMATTA DATA
        ==================================================
        */

        function formattaData(data) {


            if (!data) {

                return "";

            }


            const parti =
                data.split("-");


            if (
                parti.length !== 3
            ) {

                return data;

            }


            return (

                parti[2] +
                "/" +
                parti[1] +
                "/" +
                parti[0]

            );

        }


        /*
        ==================================================
        SICUREZZA HTML
        ==================================================
        */

        function escapeHtml(testo) {


            if (testo === null ||
                testo === undefined) {

                return "";

            }


            return String(testo)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /*
        ==================================================
        MOSTRA FRIGO
        ==================================================
        */

        function mostraFrigo() {


            const lista =
                document.getElementById(
                    "listaFrigo"
                );


            const contatore =
                document.getElementById(
                    "contatoreFrigo"
                );


            if (frigo.length === 0) {

                contatore.innerText =
                    "Nessun prodotto";


                lista.innerHTML =

                    '<div class="frigo-vuoto">' +

                    '🧊 Il frigorifero è vuoto.' +

                    '<br><br>' +

                    'Scansiona un prodotto per aggiungerlo.' +

                    '</div>';

                return;

            }


            let totale = 0;


            frigo.forEach(
                function(prodotto) {

                    totale +=
                        Number(
                            prodotto.quantitaFrigo
                        );

                }
            );


            contatore.innerText =

                frigo.length +

                " prodotti diversi • " +

                totale +

                " confezioni totali";


            let html = "";


            frigo.forEach(
                function(prodotto, indice) {


                    const stato =
                        statoScadenza(
                            prodotto.scadenza
                        );


                    html +=

                        '<div class="prodotto-frigo">';


                    if (prodotto.immagine) {

                        html +=

                            '<img ' +

                            'class="immagine-frigo" ' +

                            'src="' +

                            escapeHtml(
                                prodotto.immagine
                            ) +

                            '" ' +

                            'alt="' +

                            escapeHtml(
                                prodotto.nome
                            ) +

                            '">';

                    }

                    else {

                        html +=

                            '<div class="immagine-mancante">' +

                            '🛒' +

                            '</div>';

                    }


                    html +=

                        '<div class="nome-frigo">' +

                        escapeHtml(
                            prodotto.nome
                        ) +

                        '</div>';


                    html +=

                        '<div class="marca-frigo">' +

                        '🏷️ ' +

                        escapeHtml(
                            prodotto.marca
                        ) +

                        '</div>';


                    html +=

                        '<div class="confezione-frigo">' +

                        '📦 Confezione: ' +

                        escapeHtml(
                            prodotto.quantita
                        ) +

                        '</div>';


                    if (prodotto.categoria) {

                        html +=

                            '<div class="categoria-frigo">' +

                            '🥫 ' +

                            escapeHtml(
                                prodotto.categoria
                            ) +

                            '</div>';

                    }


                    html +=

                        '<div class="quantita-frigo">' +

                        '🧊 Quantità nel frigo: ' +

                        prodotto.quantitaFrigo +

                        '</div>';


                    html +=

                        '<div class="scadenza ' +

                        stato.classe +

                        '">' +

                        stato.testo +

                        '</div>';


                    html +=

                        '<input ' +

                        'type="date" ' +

                        'class="campo-data" ' +

                        'value="' +

                        (
                            prodotto.scadenza ||
                            ""
                        ) +

                        '" ' +

                        'onchange="cambiaScadenza(' +

                        indice +

                        ', this.value)">';


                    html +=

                        '<div class="controlli">';


                    html +=

                        '<button ' +

                        'class="meno" ' +

                        'onclick="diminuisci(' +

                        indice +

                        ')">' +

                        '➖' +

                        '</button>';


                    html +=

                        '<button ' +

                        'class="piu" ' +

                        'onclick="aumenta(' +

                        indice +

                        ')">' +

                        '➕' +

                        '</button>';


                    html +=

                        '<button ' +

                        'class="elimina" ' +

                        'onclick="elimina(' +

                        indice +

                        ')">' +

                        '🗑️' +

                        '</button>';


                    html +=

                        '</div>';


                    html +=

                        '</div>';

                }
            );


            lista.innerHTML =
                html;

        }


        /*
        ==================================================
        CAMBIA SCADENZA
        ==================================================
        */

        async function cambiaScadenza(
            indice,
            nuovaData
        ) {


            const prodotto =
                frigo[indice];


            if (!prodotto ||
                !prodotto.id) {

                return;

            }


            try {


                await supabaseFetch(

                    SUPABASE_TABELLA +

                    "?id=eq." +

                    encodeURIComponent(
                        prodotto.id
                    ),

                    {

                        method:
                            "PATCH",

                        headers: {

                            "Prefer":
                                "return=minimal"

                        },

                        body:
                            JSON.stringify({

                                scadenza:
                                    nuovaData ||
                                    null,

                                updated_at:
                                    new Date()
                                    .toISOString()

                            })

                    }

                );


                prodotto.scadenza =
                    nuovaData;


                mostraFrigo();


                statoDatabase(
                    "☁️ Scadenza aggiornata",
                    true
                );


            }


            catch (errore) {


                console.error(
                    errore
                );


                statoDatabase(
                    "❌ Errore aggiornamento scadenza",
                    false
                );


                await sincronizzaFrigo();

            }

        }

        ==================================================
        AGGIUNGI AL FRIGO

                        "?codice=eq." +

                        encodeURIComponent(
                            prodotto.codice

                        "&select=*"

                    );


                if (
                    ricerca &&
                    ricerca.length > 0
                ) {


                    const esistente =
                        ricerca[0];


                    const nuovaQuantita =

                        Number(
                            esistente.quantita_frigo
                        ) + 1;


                    await supabaseFetch(

                        SUPABASE_TABELLA +

                        "?id=eq." +

                        encodeURIComponent(
                            esistente.id
                        ),

                        {

                            method:
                                "PATCH",

                            headers: {

                                "Prefer":
                                    "return=minimal"

                            },

                            body:
                                JSON.stringify({

                                    quantita_frigo:
                                        novaQuantidadeSeguro(
                                            nuovaQuantita
                                        ),

                                    updated_at:
                                        new Date()
                                        .toISOString()

                                })

                        }

                    );

                }

                else {


                    await supabaseFetch(

                        SUPABASE_TABELLA,

                        {

                            method:
                                "POST",

                            headers: {

                                "Prefer":
                                    "return=minimal"

                            },

                            body:
                                JSON.stringify({

                                    codice:
                                        prodotto.codice,

                                    nome:
                                        prodotto.nome,

                                    marca:
                                        prodotto.marca,

                                    quantita:
                                        prodotto.quantita,

                                    categoria:
                                        prodotto.categoria,

                                    immagine:
                                        prodotto.immagine,

                                    quantita_frigo:
                                        1,

                                    scadenza:
                                        null

                                })

                        }

                    );

                }


                await sincronizzaFrigo();


                return true;


            }


            catch (errore) {


                console.error(
                    "Errore aggiunta prodotto:",
                    errore
                );


                statoDatabase(
                    "❌ Errore salvataggio prodotto",
                    false
                );


                return false;

            }

        }


        /*
        ==================================================
        SICUREZZA QUANTITÀ
        ==================================================
        */

        function novaQuantidadeSeguro(
            valore
        ) {


            const numero =
                Number(valore);


            if (
                !Number.isFinite(numero) ||
                numero < 1
            ) {

                return 1;

            }


            return Math.floor(
                numero
            );

        }


        /*
        ==================================================
        AUMENTA
        ==================================================
        */

        async function aumenta(
            indice
        ) {


            const prodotto =
                frigo[indice];


            if (!prodotto ||
                !prodotto.id) {

                return;

            }


            try {


                const nuovaQuantita =

                    Number(
                        prodotto.quantitaFrigo
                    ) + 1;


                await supabaseFetch(

                    SUPABASE_TABELLA +

                    "?id=eq." +

                    encodeURIComponent(
                        prodotto.id
                    ),

                    {

                        method:
                            "PATCH",

                        headers: {

                            "Prefer":
                                "return=minimal"

                        },

                        body:
                            JSON.stringify({

                                quantita_frigo:
                                    novaQuantidadeSeguro(
                                        nuovaQuantita
                                    ),

                                updated_at:
                                    new Date()
                                    .toISOString()

                            })

                    }

                );


                await sincronizzaFrigo();


            }


            catch (errore) {


                console.error(
                    errore
                );


                statoDatabase(
                    "❌ Errore aumento quantità",
                    false
                );

            }

        }


        /*
        ==================================================
        DIMINUISCI
        ==================================================
        */

        async function diminuisci(
            indice
        ) {


            const prodotto =
                frigo[indice];


            if (!prodotto ||
                !prodotto.id) {

                return;

            }


            try {


                const quantitaAttuale =
                    Number(
                        prodotto.quantitaFrigo
                    );


                if (
                    quantitaAttuale > 1
                ) {


                    await supabaseFetch(

                        SUPABASE_TABELLA +

                        "?id=eq." +

                        encodeURIComponent(
                            prodotto.id
                        ),

                        {

                            method:
                                "PATCH",

                            headers: {

                                "Prefer":
                                    "return=minimal"

                            },

                            body:
                                JSON.stringify({

                                    quantita_frigo:

                                        quantitaAttuale - 1,

                                    updated_at:
                                        new Date()
                                        .toISOString()

                                })

                        }

                    );

                }

                else {


                    await supabaseFetch(

                        SUPABASE_TABELLA +

                        "?id=eq." +

                        encodeURIComponent(
                            prodotto.id
                        ),

                        {

                            method:
                                "DELETE"

                        }

                    );

                }


                await sincronizzaFrigo();


            }


            catch (errore) {


                console.error(
                    errore
                );


                statoDatabase(
                    "❌ Errore diminuzione quantità",

                );

            }

        }

        /*
        ==================================================
        IMPORTAZIONE VECCHIO FRIGO
        ==================================================
        */

        function controllaImportazioneLocale() {


            const datiLocali =
                localStorage.getItem(
                    "frigoFamiglia"
                );


            if (!datiLocali) {

                return;

            }


            let locale;


            try {

                locale =
                    JSON.parse(
                        datiLocali
                    );

            }

            catch {

                return;

            }


            if (
                !Array.isArray(locale) ||
                locale.length === 0
            ) {

                return;

            }


            /*
            Se il database è vuoto,
            mostriamo il pulsante.
            */

            if (
                frigo.length === 0
            ) {

                document.getElementById(
                    "importaButton"
                ).style.display =
                    "block";

            }

        }


        /*
        ==================================================
        IMPORTA FRIGO LOCALE
        ==================================================
        */

        async function importaFrigoLocale() {


            const datiLocali =
                localStorage.getItem(
                    "frigoFamiglia"
                );


            if (!datiLocali) {

                return;

            }


            let locale;


            try {

                locale =
                    JSON.parse(
                        datiLocali
                    );

            }

            catch {

                alert(
                    "❌ Impossibile leggere il vecchio frigo."
                );

                return;

            }


            if (
                !Array.isArray(locale) ||
                locale.length === 0
            ) {

                alert(
                    "🧊 Nessun prodotto locale da importare."
                );

                return;

            }


            const conferma =
                confirm(

                    "Ho trovato " +
                    locale.length +
                    " prodotti nel vecchio frigo.\n\n" +

                    "Vuoi importarli nel Frigo Famiglia condiviso?"

                );


            if (!conferma) {

                return;

            }


            statoDatabase(
                "📥 Importazione del vecchio frigo...",
                true
            );


            try {


                for (
                    const prodotto of locale
                ) {


                    const ricerca =
                        await supabaseFetch(

                            SUPABASE_TABELLA +

                            "?codice=eq." +

                            encodeURIComponent(
                                prodotto.codice
                            ) +

                            "&select=*"

                        );


                    if (
                        ricerca &&
                        ricerca.length > 0
                    ) {


                        const esistente =
                            ricerca[0];


                        await supabaseFetch(

                            SUPABASE_TABELLA +

                            "?id=eq." +

                            encodeURIComponent(
                                esistente.id
                            ),

                            {

                                method:
                                    "PATCH",

                                headers: {

                                    "Prefer":
                                        "return=minimal"

                                },

                                body:
                                    JSON.stringify({

                                        quantita_frigo:

                                            Number(
                                                esistente.quantita_frigo
                                            ) +

                                            Number(
                                                prodotto.quantitaFrigo
                                            ),

                                        updated_at:
                                            new Date()
                                            .toISOString()

                                    })

                            }

                        );

                    }

                    else {


                        await supabaseFetch(

                            SUPABASE_TABELLA,

                            {

                                method:
                                    "POST",

                                headers: {

                                    "Prefer":
                                        "return=minimal"

                                },

                                body:
                                    JSON.stringify({

                                        codice:
                                            prodotto.codice,

                                        nome:
                                            prodotto.nome,

                                        marca:
                                            prodotto.marca,

                                        quantita:
                                            prodotto.quantita,

                                        categoria:
                                            prodotto.categoria,

                                        immagine:
                                            prodotto.immagine,

                                        quantita_frigo:
                                            novaQuantidadeSeguro(
                                                prodotto.quantitaFrigo
                                            ),

                                        scadenza:
                                            prodotto.scadenza ||
                                            null

                                    })

                            }

                        );

                    }

                }


                await sincronizzaFrigo();


                document.getElementById(
                    "importaButton"
                ).style.display =
                    "none";


                statoDatabase(
                    "✅ Vecchio frigo importato nel database condiviso",
                    true
                );


            }


            catch (errore) {


                console.error(
                    "Errore importazione:",
                    errore
                );


                statoDatabase(
                    "❌ Errore durante importazione",
                    false
                );

            }

        }


        /*
        ==================================================
        TELEGRAM
        ==================================================
        */

        async function inviaFrigoTelegram() {


            const risultato =
                document.getElementById(
                    "telegramRisultato"
                );


            if (
                frigo.length === 0
            ) {

                risultato.innerText =
                    "🧊 Il frigo è vuoto.";

                return;

            }


            let messaggio =
                "🧊 FRIGO FAMIGLIA\n\n";


            messaggio +=
                "📦 Prodotti presenti:\n\n";


            frigo.forEach(
                function(prodotto, indice) {


                    messaggio +=

                        (indice + 1) +
                        ". " +
                        prodotto.nome +
                        "\n";


                    messaggio +=

                        "🏷️ " +
                        prodotto.marca +
                        "\n";


                    messaggio +=

                        "📦 " +
                        prodotto.quantita +
                        "\n";


                    messaggio +=

                        "🧊 Quantità: " +
                        prodotto.quantitaFrigo +
                        "\n";


                    if (
                        prodotto.scadenza
                    ) {

                        messaggio +=

                            "📅 Scadenza: " +

                            formattaData(
                                prodotto.scadenza
                            ) +

                            "\n";

                    }


                    messaggio +=
                        "\n";

                }
            );


            risultato.innerText =
                "📤 Invio del frigo a Telegram...";


            try {


                const risposta =
                    await fetch(

                        TELEGRAM_WORKER,

                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    chat_id:
                                        TELEGRAM_CHAT_ID,

                                    messaggio:
                                        messaggio

                                })

                        }

                    );


                const dati =
                    await risposta.json();


                if (
                    !risposta.ok ||
                    !dati.ok
                ) {

                    throw new Error(

                        dati.description ||

                        dati.errore ||

                        "Errore Telegram"

                    );

                }


                risultato.innerText =
                    "✅ Frigo inviato al gruppo famiglia!";


            }

            catch (errore) {


                console.error(
                    "Errore Telegram:",
                    errore
                );


                risultato.innerText =

                    "❌ Errore invio Telegram: " +

                    errore.message;

            }

        }


        /*
        ==================================================
        AVVIA SCANNER
        ==================================================
        */

        function avviaScanner() {


            console.log(
                "Avvio scanner..."
            );


            codiceGiaLetto =
                false;


            scansioneInCorso =
                true;


            scanner =
                new Html5Qrcode(
                    "reader"
                );


            const configurazione = {

                fps: 10,

                qrbox: {

                    width: 300,

                    height: 150

                },

                aspectRatio:
                    1.777778

            };


            scanner.start(

                {
                    facingMode:
                        "environment"
                },

                configurazione,

                codiceLetto,

                function() {

                    /*
                    Errori normali ignorati
                    */

                }

            )

            .then(function() {

                console.log(
                    "Fotocamera avviata"
                );

            })

            .catch(function(errore) {

                console.error(
                    "Errore fotocamera:",
                    errore
                );


                scansioneInCorso =
                    false;


                document.getElementById(
                    "reader"
                ).innerHTML =

                    '<div class="errore">' +

                    '❌ Impossibile avviare la fotocamera.' +

                    '<br><br>' +

                    errore +

                    '</div>';

            });

        }


        /*
        ==================================================
        CODICE LETTO
        ==================================================
        */

        function codiceLetto(
            decodedText,
            decodedResult
        ) {


            if (codiceGiaLetto) {

                return;

            }


            codiceGiaLetto =
                true;


            console.log(
                "Codice letto:",
                decodedText
            );


            document.getElementById(
                "codice"
            ).innerText =
                decodedText;


            document.getElementById(
                "prodotto"
            ).innerHTML =

                '<div class="caricamento">' +

                '🔎 Cerco il prodotto...' +

                '<br><br>' +

                '<strong>' +

                escapeHtml(
                    decodedText
                ) +

                '</strong>' +

                '</div>';


            fermaScanner();


            cercaProdotto(
                decodedText
            );

        }


        /*
        ==================================================
        FERMA SCANNER
        ==================================================
        */

        async function fermaScanner() {


            if (
                scanner &&
                scansioneInCorso
            ) {

                try {

                    await scanner.stop();

                    await scanner.clear();

                }

                catch(errore) {

                    console.error(
                        errore
                    );

                }


                scansioneInCorso =
                    false;

            }

        }


        /*
        ==================================================
        CERCA PRODOTTO OPEN FOOD FACTS
        ==================================================
        */

        async function cercaProdotto(
            codice
        ) {


            const contenitore =
                document.getElementById(
                    "prodotto"
                );


            const url =

                "https://world.openfoodfacts.org/api/v3/product/" +

                encodeURIComponent(
                    codice
                ) +

                "?product_type=food" +

                "&cc=it" +

                "&lc=it" +

                "&fields=" +

                "code," +

                "product_name," +

                "product_name_it," +

                "brands," +

                "quantity," +

                "product_quantity," +

                "product_quantity_unit," +

                "categories," +

                "image_front_url";


            try {


                const risposta =
                    await fetch(url);


                if (!risposta.ok) {

                    throw new Error(
                        "HTTP " +
                        risposta.status
                    );

                }


                const dati =
                    await risposta.json();


                if (!dati.product) {

                    contenitore.innerHTML =

                        '<div class="errore">' +

                        '❌ Prodotto non trovato' +

                        '<br><br>' +

                        'Codice: ' +

                        escapeHtml(
                            codice
                        ) +

                        '</div>';


                    mostraPulsante();

                    return;

                }


                const prodotto =
                    dati.product;


                const nome =

                    prodotto.product_name_it ||

                    prodotto.product_name ||

                    "Nome non disponibile";


                const marca =

                    prodotto.brands ||

                    "Marca non disponibile";


                let quantita =
                    prodotto.quantity || "";


                if (!quantita) {

                    if (
                        prodotto.product_quantity &&
                        prodotto.product_quantity_unit
                    ) {

                        quantita =

                            prodotto.product_quantity +

                            " " +

                            prodotto.product_quantity_unit;

                    }

                }


                if (!quantita) {

                    quantita =
                        "Quantità non disponibile";

                }


                const categoria =

                    prodotto.categories ||

                    "Categoria non disponibile";


                const immagine =

                    prodotto.image_front_url ||

                    "";


                /*
                ==================================================
                SALVATAGGIO DIRETTO SU SUPABASE
                ==================================================
                */

                const salvato =
                    await aggiungiAlFrigo({

                        codice:
                            codice,

                        nome:
                            nome,

                        marca:
                            marca,

                        quantita:
                            quantita,

                        categoria:
                            categoria,

                        immagine:
                            immagine

                    });


                if (!salvato) {

                    contenitore.innerHTML =

                        '<div class="errore">' +

                        '❌ Prodotto trovato, ma non è stato possibile salvarlo nel frigo condiviso.' +

                        '</div>';

                    mostraPulsante();

                    return;

                }


                /*
                ==================================================
                RISULTATO
                ==================================================
                */

                let html = "";


                html +=

                    '<div class="successo">' +

                    '✅ PRODOTTO TROVATO!' +

                    '</div>';


                html +=

                    '<div class="nome-prodotto">' +

                    '🛒 ' +

                    escapeHtml(
                        nome
                    ) +

                    '</div>';


                html +=

                    '<div class="dato">' +

                    '🏷️ ' +

                    escapeHtml(
                        marca
                    ) +

                    '</div>';


                html +=

                    '<div class="dato">' +

                    '📦 Confezione: ' +

                    escapeHtml(
                        quantita
                    ) +

                    '</div>';


                html +=

                    '<div class="dato">' +

                    '🥫 Categoria: ' +

                    escapeHtml(
                        categoria
                    ) +

                    '</div>';


                html +=

                    '<div class="dato">' +

                    '🔢 Codice: ' +

                    escapeHtml(
                        codice
                    ) +

                    '</div>';


                html +=

                    '<div class="aggiunto">' +

                    '🧊 AGGIUNTO AL FRIGO CONDIVISO ✅' +

                    '</div>';


                if (immagine) {

                    html +=

                        '<img src="' +

                        escapeHtml(
                            immagine
                        ) +

                        '" ' +

                        'alt="' +

                        escapeHtml(
                            nome
                        ) +

                        '">';

                }


                contenitore.innerHTML =
                    html;


                mostraPulsante();


            }


            catch(errore) {


                console.error(
                    "Errore API:",
                    errore
                );


                contenitore.innerHTML =

                    '<div class="errore">' +

                    '⚠️ Errore durante la pesquisa do produto' +

                    '<br><br>' +

                    escapeHtml(
                        errore.message
                    ) +

                    '</div>';


                mostraPulsante();

            }

        }


        /*
        ==================================================
        MOSTRA PULSANTE NUOVA SCANSIONE
        ==================================================
        */

        function mostraPulsante() {

            document.getElementById(
                "nuovaScansione"
            ).style.display =
                "block";

        }


        /*
        ==================================================
        NUOVA SCANSIONE
        ==================================================
        */

        function nuovaScansione() {


            document.getElementById(
                "codice"
            ).innerText = "";


            document.getElementById(
                "prodotto"
            ).innerHTML =

                '<div class="caricamento">' +

                '📷 In attesa di una nuova scansione...' +

                '</div>';


            document.getElementById(
                "nuovaScansione"
            ).style.display =
                "none";


            document.getElementById(
                "reader"
            ).innerHTML = "";


            setTimeout(
                avviaScanner,
                300
            );

        }


        /*
        ==================================================
        AVVIO
        ==================================================
        */

        async function avviaApplicazione() {


            /*
            Prima carichiamo il database.
            */

            await caricaFrigo();


            /*
            Poi avviamo lo scanner.
            */

            avviaScanner();


            /*
            Ogni 5 secondi controlliamo
            se qualcuno della famiglia
            ha modificato il frigo.

            */

            setInterval(
                sincronizzaFrigo,
                5000
            );

        }


        /*
        ==================================================
        PARTENZA
        ==================================================
        */

        avviaApplicazione();


    </script>
