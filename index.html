<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Frigo Famiglia</title>

    <!-- Libreria lettura codici a barre -->
    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>


    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 25px 15px;
            background: white;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 20px;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        #risultato {
            margin-top: 25px;
        }

        #codice {
            font-size: 26px;
            font-weight: bold;
            margin-top: 10px;
            word-break: break-all;
        }

        #prodotto {
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            background: #f2f2f2;
            max-width: 500px;
        }

        #prodotto img {
            max-width: 220px;
            max-height: 220px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .nome-prodotto {
            font-size: 28px;
            font-weight: bold;
            margin-top: 15px;
        }

        .dato {
            font-size: 20px;
            margin-top: 12px;
        }

        .caricamento {
            font-size: 20px;
            margin-top: 15px;
        }

        .successo {
            color: #2e7d32;
            font-size: 22px;
            font-weight: bold;
        }

        .errore {
            color: #c62828;
            font-size: 20px;
            font-weight: bold;
        }

        .debug {
            margin-top: 20px;
            padding: 15px;
            background: #e8e8e8;
            border-radius: 10px;
            text-align: left;
            font-size: 14px;
            word-break: break-word;
        }

        button {
            margin-top: 20px;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: #1976d2;
            color: white;
            cursor: pointer;
        }

    </style>

</head>


<body>


    <h1>🥶 Frigo Famiglia</h1>


    <h2>📷 Inquadra il codice a barre</h2>


    <!--
        TELECAMERA
    -->

    <div id="reader"></div>


    <!--
        CODICE LETTO
    -->

    <div id="risultato">

        <h2>✅ Codice trovato:</h2>

        <div id="codice"></div>

    </div>


    <!--
        RISULTATO PRODOTTO
    -->

    <div id="prodotto">

        <div class="caricamento">

            📷 In attesa di una scansione...

        </div>

    </div>


    <!--
        PULSANTE NUOVA SCANSIONE
    -->

    <button
        id="nuovaScansione"
        onclick="nuovaScansione()"
        style="display:none;">

        📷 Scansiona un altro prodotto

    </button>



    <script>


        /*
        ==================================================
        VARIABILI
        ==================================================
        */

        let scanner = null;

        let scansioneInCorso = false;

        let codiceGiaLetto = false;



        /*
        ==================================================
        AVVIO SCANNER
        ==================================================
        */

        function avviaScanner() {


            console.log(
                "AVVIO SCANNER"
            );


            codiceGiaLetto = false;

            scansioneInCorso = true;


            /*
            Creiamo nuovo scanner
            */

            scanner =
                new Html5Qrcode("reader");


            /*
            Configurazione
            */

            const configurazione = {

                fps: 10,

                qrbox: {
                    width: 300,
                    height: 150
                },

                aspectRatio: 1.777778

            };


            /*
            Avvio fotocamera posteriore
            */

            scanner.start(

                {
                    facingMode: "environment"
                },

                configurazione,

                codiceLetto,

                function () {

                    /*
                    Errori normali di scansione
                    ignorati.
                    */

                }

            )

            .then(function () {

                console.log(
                    "FOTOCAMERA AVVIATA"
                );

            })

            .catch(function (errore) {

                console.error(
                    "ERRORE FOTOCAMERA:",
                    errore
                );


                scansioneInCorso = false;


                document.getElementById(
                    "reader"
                ).innerHTML =

                    '<div class="errore">' +

                    '❌ Impossibile avviare la fotocamera.' +

                    '<br><br>' +

                    errore +

                    '</div>';

            });

        }



        /*
        ==================================================
        CODICE LETTO
        ==================================================
        */

        function codiceLetto(decodedText, decodedResult) {


            /*
            Evitiamo letture duplicate
            */

            if (codiceGiaLetto) {

                return;

            }


            codiceGiaLetto = true;


            console.log(
                "CODICE LETTO:",
                decodedText
            );


            /*
            Mostriamo codice
            */

            document.getElementById(
                "codice"
            ).innerText = decodedText;


            /*
            Mostriamo subito il messaggio
            */

            document.getElementById(
                "prodotto"
            ).innerHTML =

                '<div class="caricamento">' +

                '🔎 Codice letto!<br><br>' +

                '🌐 Cerco il prodotto su Open Food Facts...<br><br>' +

                '<strong>' +

                decodedText +

                '</strong>' +

                '</div>';


            /*
            Fermiamo scanner
            */

            fermaScanner();


            /*
            Cerchiamo prodotto
            */

            cercaProdotto(decodedText);

        }



        /*
        ==================================================
        FERMA SCANNER
        ==================================================
        */

        async function fermaScanner() {


            if (
                scanner &&
                scansioneInCorso
            ) {

                try {

                    await scanner.stop();

                    await scanner.clear();

                    console.log(
                        "SCANNER FERMATO"
                    );

                }

                catch (errore) {

                    console.error(
                        "ERRORE FERMATA SCANNER:",
                        errore
                    );

                }

                scansioneInCorso = false;

            }

        }



        /*
        ==================================================
        CERCA PRODOTTO
        ==================================================
        */

        async function cercaProdotto(codice) {


            const contenitore =
                document.getElementById(
                    "prodotto"
                );


            /*
            API V3 OPEN FOOD FACTS
            */

            const url =

                "https://world.openfoodfacts.org/api/v3/product/" +

                encodeURIComponent(codice) +

                "?product_type=food" +

                "&cc=it" +

                "&lc=it" +

                "&fields=" +

                "code," +

                "product_name," +

                "product_name_it," +

                "brands," +

                "quantity," +

                "product_quantity," +

                "product_quantity_unit," +

                "categories," +

                "image_front_url";


            console.log(
                "URL API:",
                url
            );


            try {


                /*
                ==================================================
                CHIAMATA API
                ==================================================
                */

                const risposta =

                    await fetch(

                        url,

                        {

                            method: "GET",

                            headers: {

                                "User-Agent":
                                    "FrigoFamiglia/1.0 (GitHub Pages)"

                            }

                        }

                    );


                console.log(
                    "HTTP:",
                    risposta.status
                );


                /*
                ==================================================
                CONTROLLO RISPOSTA
                ==================================================
                */

                if (!risposta.ok) {

                    throw new Error(
                        "HTTP " +
                        risposta.status
                    );

                }


                /*
                ==================================================
                JSON
                ==================================================
                */

                const dati =
                    await risposta.json();


                console.log(
                    "RISPOSTA OPEN FOOD FACTS:",
                    dati
                );


                /*
                ==================================================
                CONTROLLO PRODOTTO
                ==================================================
                */

                if (
                    !dati.product
                ) {


                    contenitore.innerHTML =

                        '<div class="errore">' +

                        '❌ Prodotto non trovato' +

                        '</div>' +

                        '<div class="debug">' +

                        '<strong>Diagnostica</strong>' +

                        '<br><br>' +

                        'Codice: ' +

                        codice +

                        '<br>' +

                        'HTTP: ' +

                        risposta.status +

                        '<br><br>' +

                        'Open Food Facts non ha restituito un prodotto per questo codice.'

                        +

                        '</div>';


                    mostraPulsante();


                    return;

                }



                /*
                ==================================================
                PRODOTTO
                ==================================================
                */

                const prodotto =
                    dati.product;



                /*
                ==================================================
                NOME
                ==================================================
                */

                const nome =

                    prodotto.product_name_it ||

                    prodotto.product_name ||

                    "Nome non disponibile";



                /*
                ==================================================
                MARCA
                ==================================================
                */

                const marca =

                    prodotto.brands ||

                    "Marca non disponibile";



                /*
                ==================================================
                QUANTITÀ
                ==================================================
                */

                let quantita =

                    prodotto.quantity || "";


                /*
                Se quantity non esiste,
                proviamo product_quantity
                */

                if (!quantita) {

                    if (
                        prodotto.product_quantity &&
                        prodotto.product_quantity_unit
                    ) {

                        quantita =

                            prodotto.product_quantity +

                            " " +

                            prodotto.product_quantity_unit;

                    }

                }


                if (!quantita) {

                    quantita =
                        "Quantità non disponibile";

                }



                /*
                ==================================================
                CATEGORIA
                ==================================================
                */

                const categoria =

                    prodotto.categories ||

                    "Categoria non disponibile";



                /*
                ==================================================
                IMMAGINE
                ==================================================
                */

                const immagine =

                    prodotto.image_front_url ||

                    "";



                /*
                ==================================================
                VISUALIZZAZIONE
                ==================================================
                */

                let html = "";


                html +=

                    '<div class="successo">' +

                    '✅ PRODOTTO TROVATO!' +

                    '</div>';


                html +=

                    '<div class="nome-prodotto">' +

                    '🛒 ' +

                    nome +

                    '</div>';


                html +=

                    '<div class="dato">' +

                    '🏷️ Marca: ' +

                    marca +

                    '</div>';


                html +=

                    '<div class="dato">' +

                    '📦 Quantità: ' +

                    quantita +

                    '</div>';


                html +=

                    '<div class="dato">' +

                    '🥫 Categoria: ' +

                    categoria +

                    '</div>';


                html +=

                    '<div class="dato">' +

                    '🔢 Codice: ' +

                    codice +

                    '</div>';


                /*
                ==================================================
                IMMAGINE
                ==================================================
                */

                if (immagine) {

                    html +=

                        '<img ' +

                        'src="' +

                        immagine +

                        '" ' +

                        'alt="Immagine prodotto">';

                }


                /*
                Inseriamo risultato
                */

                contenitore.innerHTML =
                    html;


                console.log(
                    "NOME:",
                    nome
                );

                console.log(
                    "MARCA:",
                    marca
                );

                console.log(
                    "QUANTITA:",
                    quantita
                );

                console.log(
                    "CATEGORIA:",
                    categoria
                );


                mostraPulsante();

            }


            catch (errore) {


                console.error(
                    "ERRORE API:",
                    errore
                );


                contenitore.innerHTML =

                    '<div class="errore">' +

                    '⚠️ Errore durante la ricerca' +

                    '</div>' +

                    '<div class="debug">' +

                    '<strong>Dettagli tecnici</strong>' +

                    '<br><br>' +

                    'Codice: ' +

                    codice +

                    '<br><br>' +

                    errore.message +

                    '</div>';


                mostraPulsante();

            }

        }



        /*
        ==================================================
        MOSTRA PULSANTE
        ==================================================
        */

        function mostraPulsante() {

            document.getElementById(
                "nuovaScansione"
            ).style.display =
                "inline-block";

        }



        /*
        ==================================================
        NUOVA SCANSIONE
        ==================================================
        */

        function nuovaScansione() {


            document.getElementById(
                "codice"
            ).innerText = "";


            document.getElementById(
                "prodotto"
            ).innerHTML =

                '<div class="caricamento">' +

                '📷 In attesa di una nuova scansione...'

                +

                '</div>';


            document.getElementById(
                "nuovaScansione"
            ).style.display =
                "none";


            /*
            Puliamo reader
            */

            document.getElementById(
                "reader"
            ).innerHTML = "";


            /*
            Riavviamo
            */

            setTimeout(
                avviaScanner,
                300
            );

        }



        /*
        ==================================================
        AVVIO AUTOMATICO
        ==================================================
        */

        avviaScanner();


    </script>


</body>

</html>
