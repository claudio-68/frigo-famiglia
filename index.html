<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frigo Famiglia</title>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        #reader {
            max-width: 500px;
            margin: auto;
        }

        #result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🥶 Frigo Famiglia</h1>

    <p>📷 Inquadra il codice a barre</p>

    <div id="reader"></div>

    <div id="result">
        Nessun prodotto scansionato
    </div>

    <script>
        let html5QrCode;

        async function startScanner() {

            html5QrCode = new Html5Qrcode("reader");

            const config = {
                fps: 10,
                qrbox: {
                    width: 300,
                    height: 150
                },
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E
                ]
            };

            try {

                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    onScanFailure
                );

            } catch (err) {

                document.getElementById("result").innerHTML =
                    "❌ Impossibile avviare la fotocamera";

                console.error(err);
            }
        }

        function onScanSuccess(decodedText, decodedResult) {

            document.getElementById("result").innerHTML =
                "✅ Codice trovato:<br><br>" + decodedText;

            html5QrCode.stop();
        }

        function onScanFailure(error) {
            // Ignoriamo gli errori durante la ricerca del codice
        }

        startScanner();
    </script>

</body>
</html>
