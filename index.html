<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Frigo Famiglia</title>

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
            background: white;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 25px;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        #risultato {
            margin-top: 30px;
            font-size: 22px;
        }

        #codice {
            font-size: 26px;
            font-weight: bold;
            margin-top: 10px;
            word-break: break-all;
        }

        #prodotto {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background: #f2f2f2;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        #prodotto img {
            max-width: 220px;
            max-height: 220px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .nome-prodotto {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }

        .marca {
            font-size: 20px;
            margin-top: 12px;
        }

        .caricamento {
            font-size: 20px;
            margin-top: 10px;
        }

        .errore {
            color: #c62828;
            font-weight: bold;
            font-size: 20px;
        }

        .successo {
            color: #2e7d32;
            font-weight: bold;
            font-size: 20px;
        }

        .pulsante {
            margin-top: 25px;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: #1976d2;
            color: white;
            cursor: pointer;
        }

        .pulsante:hover {
            background: #1565c0;
        }

    </style>

</head>


<body>


    <h1>🥶 Frigo Famiglia</h1>


    <h2>📷 Inquadra il codice a barre</h2>


    <!-- SCANNER -->

    <div id="reader"></div>


    <!-- RISULTATO CODICE -->

    <div id="risultato">

        <h2>✅ Codice trovato:</h2>

        <div id="codice"></div>

    </div>


    <!-- PRODOTTO -->

    <div id="prodotto"></div>


    <!-- PULSANTE NUOVA SCANSIONE -->

    <button
        id="nuovaScansione"
        class="pulsante"
        onclick="avviaScanner()"
        style="display:none;">

        📷 Scansiona un altro prodotto

    </button>


    <script>


        /*
        ==================================================
        VARIABILI
        ==================================================
        */

        let scanner = null;

        let scannerAttivo = false;

        let codiceGiaLetto = false;


        /*
        ==================================================
        AVVIA SCANNER
        ==================================================
        */

        function avviaScanner() {


            console.log(
                "Avvio scanner..."
            );


            /*
            Se esiste già uno scanner,
            lo ricreiamo da zero.
            */

            scanner = new Html5Qrcode("reader");


            scannerAttivo = true;

            codiceGiaLetto = false;


            /*
            Puliamo i risultati precedenti
            */

            document.getElementById(
                "codice"
            ).innerText = "";


            document.getElementById(
                "prodotto"
            ).innerHTML = "";


            document.getElementById(
                "nuovaScansione"
            ).style.display = "none";


            /*
            Configurazione scanner
            */

            const configurazione = {

                fps: 10,

                qrbox: {
                    width: 300,
                    height: 150
                },

                aspectRatio: 1.777778

            };


            /*
            Avviamo fotocamera posteriore
            */

            scanner.start(

                {
                    facingMode: "environment"
                },

                configurazione,

                codiceLetto,

                function (errore) {

                    /*
                    Gli errori normali durante
                    la ricerca del codice
                    vengono ignorati.
                    */

                }

            )

            .then(() => {

                console.log(
                    "Scanner avviato correttamente"
                );

            })

            .catch((errore) => {

                console.error(
                    "Errore avvio scanner:",
                    errore
                );


                scannerAttivo = false;


                document.getElementById(
                    "reader"
                ).innerHTML =

                    '<div class="errore">' +

                    '❌ Impossibile avviare la fotocamera.' +

                    '<br><br>' +

                    errore +

                    '</div>';

            });

        }


        /*
        ==================================================
        CODICE LETTO
        ==================================================
        */

        function codiceLetto(decodedText, decodedResult) {


            /*
            Evitiamo che lo scanner
            legga lo stesso codice
            molte volte.
            */

            if (codiceGiaLetto) {

                return;

            }


            codiceGiaLetto = true;


            console.log(
                "CODICE LETTO:",
                decodedText
            );


            /*
            Mostriamo codice
            */

            document.getElementById(
                "codice"
            ).innerText = decodedText;


            /*
            Fermiamo la fotocamera
            */

            fermaScanner();


            /*
            Cerchiamo il prodotto
            */

            cercaProdotto(decodedText);

        }


        /*
        ==================================================
        FERMA SCANNER
        ==================================================
        */

        function fermaScanner() {


            if (
                scanner &&
                scannerAttivo
            ) {


                scanner.clear()

                    .then(() => {

                        console.log(
                            "Scanner fermato"
                        );

                        scannerAttivo = false;

                    })

                    .catch((errore) => {

                        console.error(
                            "Errore arresto scanner:",
                            errore
                        );

                        scannerAttivo = false;

                    });

            }

        }


        /*
        ==================================================
        CERCA PRODOTTO
        ==================================================
        */

        async function cercaProdotto(codice) {


            const contenitore =
                document.getElementById(
                    "prodotto"
                );


            /*
            Messaggio caricamento
            */

            contenitore.innerHTML =

                '<div class="caricamento">' +

                '🔎 Cerco il prodotto...' +

                '<br><br>' +

                'Codice: ' +

                codice +

                '</div>';


            try {


                /*
                ==================================================
                URL OPEN FOOD FACTS
                ==================================================
                */

                const url =

                    "https://world.openfoodfacts.org/api/v2/product/" +

                    encodeURIComponent(codice) +

                    "?fields=" +

                    "code," +

                    "product_name," +

                    "product_name_it," +

                    "brands," +

                    "quantity," +

                    "categories," +

                    "image_front_url";


                console.log(
                    "Chiamata API:",
                    url
                );


                /*
                Chiamata al database
                */

                const risposta =
                    await fetch(url);


                console.log(
                    "HTTP:",
                    risposta.status
                );


                /*
                Controlliamo risposta
                */

                if (!risposta.ok) {

                    throw new Error(
                        "Errore HTTP " +
                        risposta.status
                    );

                }


                /*
                Convertiamo risposta
                */

                const dati =
                    await risposta.json();


                console.log(
                    "DATI RICEVUTI:",
                    dati
                );


                /*
                ==================================================
                PRODOTTO NON TROVATO
                ==================================================
                */

                if (
                    dati.status !== 1 ||
                    !dati.product
                ) {


                    contenitore.innerHTML =

                        '<div class="errore">' +

                        '❌ Prodotto non trovato' +

                        '<br><br>' +

                        'Il codice è stato letto correttamente.' +

                        '<br><br>' +

                        'Codice: ' +

                        codice +

                        '</div>';


                    mostraPulsante();

                    return;

                }


                /*
                ==================================================
                PRODOTTO TROVATO
                ==================================================
                */

                const prodotto =
                    dati.product;


                /*
                Nome
                */

                const nome =

                    prodotto.product_name_it ||

                    prodotto.product_name ||

                    "Nome non disponibile";


                /*
                Marca
                */

                const marca =

                    prodotto.brands ||

                    "Marca non disponibile";


                /*
                Quantità
                */

                const quantita =

                    prodotto.quantity ||

                    "Quantità non disponibile";


                /*
                Categoria
                */

                const categoria =

                    prodotto.categories ||

                    "Categoria non disponibile";


                /*
                Immagine
                */

                const immagine =

                    prodotto.image_front_url ||

                    "";


                /*
                ==================================================
                CREIAMO RISULTATO
                ==================================================
                */

                let html = "";


                html +=

                    '<div class="successo">' +

                    '✅ PRODOTTO TROVATO!' +

                    '</div>';


                html +=

                    '<div class="nome-prodotto">' +

                    '🛒 ' +

                    nome +

                    '</div>';


                html +=

                    '<div class="marca">' +

                    '🏷️ ' +

                    marca +

                    '</div>';


                html +=

                    '<div class="marca">' +

                    '📦 Quantità: ' +

                    quantita +

                    '</div>';


                html +=

                    '<div class="marca">' +

                    '🥫 Categoria: ' +

                    categoria +

                    '</div>';


                html +=

                    '<div style="margin-top:15px;">' +

                    '🔢 Codice: ' +

                    codice +

                    '</div>';


                /*
                Immagine
                */

                if (immagine) {

                    html +=

                        '<img src="' +

                        immagine +

                        '" ' +

                        'alt="Immagine prodotto">';

                }


                /*
                Mostriamo prodotto
                */

                contenitore.innerHTML = html;


                /*
                Mostriamo pulsante
                */

                mostraPulsante();


            }


            catch (errore) {


                console.error(
                    "ERRORE API:",
                    errore
                );


                contenitore.innerHTML =

                    '<div class="errore">' +

                    '⚠️ Errore nel collegamento a Open Food Facts' +

                    '<br><br>' +

                    errore.message +

                    '</div>';


                mostraPulsante();

            }

        }


        /*
        ==================================================
        MOSTRA PULSANTE
        ==================================================
        */

        function mostraPulsante() {

            document.getElementById(
                "nuovaScansione"
            ).style.display = "inline-block";

        }


        /*
        ==================================================
        AVVIO AUTOMATICO
        ==================================================
        */

        avviaScanner();


    </script>


</body>

</html>
