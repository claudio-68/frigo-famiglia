    <script>


        /*
        ==================================================
        SUPABASE
        ==================================================
        */

        const SUPABASE_URL =
            "https://gfoukzgadjidvamoeslm.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_s97FpTxFjeap3_pEHIytIg_DY0FtVvq";


        const SUPABASE_TABELLA =
            "prodotti_frigo";


        /*
        ==================================================
        TELEGRAM
        ==================================================
        */

        const TELEGRAM_WORKER =
            "https://frigo-telegram.ilclait.workers.dev";


        const TELEGRAM_CHAT_ID =
            "-1004296706652";


        /*
        ==================================================
        SCANNER
        ==================================================
        */

        let scanner = null;

        let scansioneInCorso = false;

        let codiceGiaLetto = false;


        /*
        ==================================================
        FRIGO
        ==================================================
        */

        let frigo = [];

        let sezioneAttiva = "frigo";

        let ubicazioneScelta = "frigo";


        /*
        ==================================================
        SUPABASE FETCH
        ==================================================
        */

        async function supabaseFetch(
            endpoint,
            options = {}
        ) {

            const headers = {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                "Content-Type":
                    "application/json",

                ...(options.headers || {})

            };


            const risposta =

                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/" +
                    endpoint,

                    {

                        ...options,

                        headers:
                            headers

                    }

                );


            if (!risposta.ok) {

                const testo =
                    await risposta.text();

                throw new Error(

                    "Supabase HTTP " +
                    risposta.status +
                    ": " +
                    testo

                );

            }


            if (
                risposta.status === 204
            ) {

                return null;

            }


            const testo =
                await risposta.text();


            if (!testo) {

                return null;

            }


            return JSON.parse(testo);

        }


        /*
        ==================================================
        STATO DATABASE
        ==================================================
        */

        function statoDatabase(
            testo,
            online
        ) {

            const elemento =
                document.getElementById(
                    "databaseRisultato"
                );


            elemento.innerText =
                testo;


            elemento.className =
                online
                    ? "database-online"
                    : "database-offline";

        }


        /*
        ==================================================
        CARICA FRIGO
        ==================================================
        */

        async function caricaFrigo() {

            try {

                statoDatabase(
                    "☁️ Carico il frigo condiviso...",
                    true
                );


                const dati =
                    await supabaseFetch(

                        SUPABASE_TABELLA +
                        "?select=*&order=nome.asc"

                    );


                frigo =
                    dati.map(
                        convertiProdotto
                    );


                mostraFrigo();


                statoDatabase(
                    "☁️ Frigo condiviso sincronizzato",
                    true
                );


                controllaImportazioneLocale();

            }

            catch (errore) {

                console.error(
                    "Errore caricamento:",
                    errore
                );


                statoDatabase(
                    "❌ Errore collegamento Supabase",
                    false
                );

            }

        }


        /*
        ==================================================
        CONVERSIONE PRODOTTO
        ==================================================
        */

        function convertiProdotto(
            prodotto
        ) {

            return {

                id:
                    prodotto.id,

                codice:
                    prodotto.codice,

                nome:
                    prodotto.nome || "",

                marca:
                    prodotto.marca || "",

                quantita:
                    prodotto.quantita || "",

                categoria:
                    prodotto.categoria || "",

                immagine:
                    prodotto.immagine || "",

                quantitaFrigo:
                    Number(
                        prodotto.quantita_frigo || 0
                    ),

                scadenza:
                    prodotto.scadenza || "",

                ubicazione:
                    prodotto.ubicazione || "frigo"

            };

        }


        /*
        ==================================================
        SINCRONIZZAZIONE
        ==================================================
        */

        async function sincronizzaFrigo() {

            try {

                const dati =
                    await supabaseFetch(

                        SUPABASE_TABELLA +
                        "?select=*&order=nome.asc"

                    );


                frigo =
                    dati.map(
                        convertiProdotto
                    );


                mostraFrigo();


                statoDatabase(
                    "☁️ Frigo sincronizzato",
                    true
                );

            }

            catch (errore) {

                console.error(
                    "Errore sincronizzazione:",
                    errore
                );


                statoDatabase(
                    "⚠️ Errore sincronizzazione",
                    false
                );

            }

        }


        /*
        ==================================================
        FORMATTA DATA
        ==================================================
        */

        function formattaData(data) {

            if (!data) {

                return "";

            }


            const parti =
                data.split("-");


            if (
                parti.length !== 3
            ) {

                return data;

            }


            return (

                parti[2] +
                "/" +
                parti[1] +
                "/" +
                parti[0]

            );

        }


        /*
        ==================================================
        STATO SCADENZA
        ==================================================
        */

        function statoScadenza(data) {

            if (!data) {

                return {

                    classe:
                        "scadenza-nessuna",

                    testo:
                        "📅 Scadenza: non inserita"

                };

            }


            const oggi =
                new Date();


            oggi.setHours(
                0,
                0,
                0,
                0
            );


            const scadenza =
                new Date(
                    data +
                    "T00:00:00"
                );


            const differenza =

                Math.ceil(

                    (
                        scadenza -
                        oggi
                    )
                    /
                    (
                        1000 *
                        60 *
                        60 *
                        24
                    )

                );


            if (differenza < 0) {

                return {

                    classe:
                        "scadenza-rossa",

                    testo:
                        "🔴 Scaduto: " +
                        formattaData(data)

                };

            }


            if (differenza === 0) {

                return {

                    classe:
                        "scadenza-rossa",

                    testo:
                        "🔴 Scade oggi"

                };

            }


            if (differenza <= 3) {

                return {

                    classe:
                        "scadenza-arancio",

                    testo:
                        "🟠 Scade tra " +
                        differenza +
                        " giorni: " +
                        formattaData(data)

                };

            }


            return {

                classe:
                    "scadenza-verde",

                testo:
                    "🟢 Scadenza: " +
                    formattaData(data)

            };

        }


        /*
        ==================================================
        ESCAPE HTML
        ==================================================
        */

        function escapeHtml(
            testo
        ) {

            if (
                testo === null ||
                testo === undefined
            ) {

                return "";

            }


            return String(testo)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /*
        ==================================================
        MOSTRA FRIGO
        ==================================================
        */

        function cambiaSezione(sezione) {

            sezioneAttiva = sezione;

            document.getElementById("tabFrigo").classList.toggle(
                "attiva",
                sezione === "frigo"
            );

            document.getElementById("tabDispensa").classList.toggle(
                "attiva",
                sezione === "dispensa"
            );

            mostraFrigo();
        }


        function suggerisciUbicazione(categoria, nome) {

            const testo =
                ((categoria || "") + " " + (nome || "")).toLowerCase();

            const paroleFrigo = [
                "latte", "yogurt", "formaggio", "mozzarella",
                "burro", "panna", "ricotta", "prosciutto",
                "salame", "affettat", "carne", "pollo", "pesce",
                "salmone", "surgelat", "fresco"
            ];

            return paroleFrigo.some(
                parola => testo.includes(parola)
            ) ? "frigo" : "dispensa";
        }


        function scegliUbicazione(ubicazione) {

            ubicazioneScelta = ubicazione;

            const contenitore =
                document.getElementById("prodotto");

            contenitore
                .querySelectorAll(".scelta-ubicazione button")
                .forEach(button => {
                    button.disabled = false;
                });

            const selezionato =
                contenitore.querySelector(
                    '[data-ubicazione="' + ubicazione + '"]'
                );

            if (selezionato) {
                selezionato.disabled = true;
            }
        }


        async function confermaUbicazione() {

            const contenitore =
                document.getElementById("prodotto");

            const prodotto =
                JSON.parse(
                    contenitore.dataset.prodotto
                );

            const salvato =
                await aggiungiAlFrigo({
                    ...prodotto,
                    ubicazione: ubicazioneScelta
                });

            if (!salvato) {

                contenitore.innerHTML =
                    '<div class="errore">' +
                    '❌ Impossibile salvare il prodotto.' +
                    '</div>';

                mostraPulsante();
                return;
            }

            await inviaFrigoTelegram();

            contenitore.innerHTML =
                '<div class="successo">✅ PRODOTTO AGGIUNTO!</div>' +

                '<div class="nome-prodotto">' +
                '🛒 ' + escapeHtml(prodotto.nome) +
                '</div>' +

                '<div class="aggiunto">' +
                (ubicazioneScelta === "frigo"
                    ? "🧊 Aggiunto al Frigo"
                    : "🏠 Aggiunto alla Dispensa") +
                '</div>';

            mostraPulsante();
        }


                function mostraFrigo() {

            const lista =
                document.getElementById(
                    "listaFrigo"
                );


            const contatore =
                document.getElementById(
                    "contatoreFrigo"
                );


            const frigoSezione =
                frigo.filter(
                    prodotto =>
                        (prodotto.ubicazione || "frigo") === sezioneAttiva
                );

            if (
                frigoSezione.length === 0
            ) {

                contatore.innerText =
                    "Nessun prodotto";


                lista.innerHTML =

                    '<div class="frigo-vuoto">' +

                    '🧊 Il frigorifero è vuoto.' +

                    '<br><br>' +

                    'Scansiona un prodotto per aggiungerlo.' +

                    '</div>';


                return;

            }


            let totale = 0;


            frigo.forEach(
                function(prodotto) {

                    totale +=
                        Number(
                            prodotto.quantitaFrigo
                        );

                }
            );


            contatore.innerText =

                frigoSezione.length +

                " prodotti diversi • " +

                totale +

                " confezioni totali";


            let html = "";


            frigoSezione.forEach(
                function(
                    prodotto
                ) {

                    const indice =
                        frigo.indexOf(prodotto);


                    const stato =
                        statoScadenza(
                            prodotto.scadenza
                        );


                    html +=
                        '<div class="prodotto-frigo">';


                    /*
                    IMMAGINE
                    */

                    if (
                        prodotto.immagine
                    ) {

                        html +=

                            '<img ' +

                            'class="immagine-frigo" ' +

                            'src="' +

                            escapeHtml(
                                prodotto.immagine
                            ) +

                            '" ' +

                            'alt="' +

                            escapeHtml(
                                prodotto.nome
                            ) +

                            '">';

                    }

                    else {

                        html +=

                            '<div class="immagine-mancante">' +

                            '🛒' +

                            '</div>';

                    }


                    /*
                    NOME
                    */

                    html +=

                        '<div class="nome-frigo">' +

                        escapeHtml(
                            prodotto.nome
                        ) +

                        '</div>';


                    /*
                    MARCA
                    */

                    html +=

                        '<div class="marca-frigo">' +

                        '🏷️ ' +

                        escapeHtml(
                            prodotto.marca
                        ) +

                        '</div>';


                    /*
                    CONFEZIONE
                    */

                    html +=

                        '<div class="confezione-frigo">' +

                        '📦 Confezione: ' +

                        escapeHtml(
                            prodotto.quantita
                        ) +

                        '</div>';


                    /*
                    CATEGORIA
                    */

                    if (
                        prodotto.categoria
                    ) {

                        html +=

                            '<div class="categoria-frigo">' +

                            '🥫 ' +

                            escapeHtml(
                                prodotto.categoria
                            ) +

                            '</div>';

                    }


                    /*
                    QUANTITÀ
                    */

                    html +=

                        '<div class="quantita-frigo">' +

                        '🧊 Quantità nel frigo: ' +

                        prodottoNumero(
                            prodotto.quantitaFrigo
                        ) +

                        '</div>';

                    SCADENZA
                    */

                    html +=

                        '<div class="scadenza ' +

                        stato.classe +

                        '">' +

                        stato.testo +

                        '</div>';


                    /*
                    DATA
                    */

                    html +=

                        '<input ' +

                        'type="date" ' +

                        'class="campo-data" ' +

                        'value="' +

                        escapeHtml(
                            prodotto.scadenza || ""
                        ) +

                        '" ' +

                        'onchange="cambiaScadenza(' +

                        indice +

                        ', this.value)">';


                    /*
                    PULSANTI
                    */

                    html +=

                        '<div class="controlli">';


                    html +=

                        '<button ' +

                        'class="meno" ' +

                        'onclick="diminuisci(' +

                        '<button ' +

                        'onclick="elimina(' +

                        ')">' +

                        '🗑️' +

                        '</div>';

        function prodottoNumero(
            valore
        ) {

            const numero =
                Number(valore);


            if (
                !Number.isFinite(numero)
            ) {

                return 0;

            }


            return numero;

            }


            try {


                const quantitaAttuale =

                    quantitaAttuale > 1

                            body:

                                })

                        }

                    );

                }


                /*
                Se arriva a zero
                eliminiamo il prodotto
                */

                else {


                    await supabaseFetch(

                        SUPABASE_TABELLA +

                        encodeURIComponent(

                );

            ) {

                "🧊 FRIGO FAMIGLIA

";

                {

                    ubicazione: "frigo"
                },
                {
                    nome: "🏠 DISPENSA",
                    ubicazione: "dispensa"
                }
            ];

            for (const sezione of sezioni) {

                const prodottiSezione =
                    frigo.filter(
                        prodotto =>
                            (prodotto.ubicazione || "frigo") ===
                            sezione.ubicazione
                    );

                messaggio +=
                    sezione.nome + "

";

                if (prodottiSezione.length === 0) {

                    messaggio +=
                        "Nessun prodotto

";

                    continue;
                }

                prodottiSezione.forEach(
                    function(prodotto, indice) {

                        messaggio +=
                            (indice + 1) + ". " +
                            prodotto.nome + "
";

                        messaggio +=
                            "🏷️ " +
                            prodotto.marca + "
";

                        messaggio +=
                            "📦 " +
                            prodotto.quantita + "
";

                        messaggio +=
                            "🔢 Quantità: " +
                            prodotto.quantitaFrigo + "
";

                        if (prodotto.scadenza) {

                            messaggio +=
                                "📅 Scadenza: " +
                                formattaData(prodotto.scadenza) +
                                "
";
                        }

                        messaggio += "
";
                    }
                );
            }


            risultato.innerText =
                "📤 Invio al gruppo Telegram...";


            try {


                const risposta =
                    await fetch(

                        TELEGRAM_WORKER,

                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    chat_id:
                                        TELEGRAM_CHAT_ID,

                                    messaggio:
                                        messaggio

                                })

                        }

                    );


                const dati =
                    await risposta.json();


                if (
                    !risposta.ok ||
                    !dati.ok
                ) {

                    throw new Error(

                        dati.description ||

                        dati.errore ||

                        "Errore Telegram"

                    );

                }


                risultato.innerText =
                    "✅ Frigo inviato al gruppo famiglia!";


            }

            catch (errore) {

                console.error(
                    "Errore Telegram:",
                    errore
                );


                risultato.innerText =

                    "❌ Errore invio Telegram: " +

                    errore.message;

            }

        }

        /*
        ==================================================
        CERCA PRODOTTO
        ==================================================
        */

        async function cercaProdotto(
            codice
        ) {


            const contenitore =
                document.getElementById(
                    "prodotto"
                );


            const url =

                "https://world.openfoodfacts.org/api/v3/product/" +

                encodeURIComponent(
                    codice
                ) +

                "?product_type=food" +

                "&cc=it" +

                "&lc=it" +

                "&fields=" +

                "code," +

                "product_name," +

                "product_name_it," +

                "brands," +

                "quantity," +

                "product_quantity," +

                "product_quantity_unit," +

                "categories," +

                "image_front_url";


            try {


                const risposta =
                    await fetch(
                        url
                    );


                if (
                    !risposta.ok
                ) {

                    throw new Error(
                        "HTTP " +
                        risposta.status
                    );

                }


                const dati =
                    await risposta.json();


                /*
                PRODOTTO NON TROVATO
                */

                if (
                    !dati.product
                ) {

                    contenitore.innerHTML =

                        '<div class="errore">' +

                        '❌ Prodotto non trovato' +

                        '<br><br>' +

                        'Codice: ' +

                        escapeHtml(
                            codice
                        ) +

                        '</div>';


                    mostraPulsante();


                    return;

                }


                const prodotto =
                    dati.product;


                /*
                NOME
                */

                const nome =

                    prodotto.product_name_it ||

                    prodotto.product_name ||

                    "Nome non disponibile";


                /*
                MARCA
                */

                const marca =

                    prodotto.brands ||

                    "Marca non disponibile";


                /*
                QUANTITÀ
                */

                let quantita =
                    prodotto.quantity ||
                    "";


                if (!quantita) {

                    if (
                        prodotto.product_quantity &&
                        prodotto.product_quantity_unit
                    ) {

                        quantita =

                            prodotto.product_quantity +

                            " " +

                            prodotto.product_quantity_unit;

                    }

                }


                if (!quantita) {

                    quantita =
                        "Quantità non disponibile";

                }


                /*
                CATEGORIA
                */

                const categoria =

                    prodotto.categories ||

                    "Categoria non disponibile";


                /*
                IMMAGINE
                */

                const immagine =

                    prodotto.image_front_url ||

                    "";


                /*
                SCELTA FRIGO / DISPENSA
                */

                ubicazioneScelta =
                    suggerisciUbicazione(
                        categoria,
                        nome
                    );

                contenitore.dataset.prodotto =
                    JSON.stringify({
                        codice: codice,
                        nome: nome,
                        marca: marca,
                        quantita: quantita,
                        categoria: categoria,
                        immagine: immagine
                    });

                contenitore.innerHTML =

                    '<div class="successo">✅ PRODOTTO TROVATO!</div>' +

                    '<div class="nome-prodotto">' +
                    '🛒 ' + escapeHtml(nome) +
                    '</div>' +

                    '<div class="dato">🏷️ ' +
                    escapeHtml(marca) +
                    '</div>' +

                    '<div class="dato">📦 Confezione: ' +
                    escapeHtml(quantita) +
                    '</div>' +

                    '<div class="dato">🥫 Categoria: ' +
                    escapeHtml(categoria) +
                    '</div>' +

                    '<div class="dato">📍 Dove vuoi metterlo?</div>' +

                    '<div class="scelta-ubicazione">' +

                    '<button type="button" ' +
                    'class="ubicazione-frigo" ' +
                    'data-ubicazione="frigo" ' +
                    'onclick="scegliUbicazione(\'frigo\')">' +
                    '🧊 Frigo' +
                    '</button>' +

                    '<button type="button" ' +
                    'class="ubicazione-dispensa" ' +
                    'data-ubicazione="dispensa" ' +
                    'onclick="scegliUbicazione(\'dispensa\')">' +
                    '🏠 Dispensa' +
                    '</button>' +

                    '</div>' +

                    '<button class="nuova-scansione" ' +
                    'onclick="confermaUbicazione()">' +
                    '✅ Conferma' +
                    '</button>';

                scegliUbicazione(ubicazioneScelta);

                                /*

                let html = "";

                    '<div class="successo">' +

                    '✅ PRODOTTO TROVATO!' +

                    ) +

            }

            catch (errore) {


                console.error(
                    "Errore ricerca:",
                    errore
                );


                contenitore.innerHTML =

                    '<div class="errore">' +

                    '⚠️ Errore durante la ricerca' +

                    '<br><br>' +

                    escapeHtml(
                        errore.message
                    ) +

                    '</div>';


                mostraPulsante();

            }

        }


        /*
        ==================================================
        NUOVA SCANSIONE
        ==================================================
        */

        function mostraPulsante() {

            document.getElementById(
                "nuovaScansione"
            ).style.display =
                "block";

        }


        /*
        ==================================================
        NUOVA SCANSIONE
        ==================================================
        */

        function nuovaScansione() {


            document.getElementById(
                "codice"
            ).innerText =
                "";


            document.getElementById(
                "prodotto"
            ).innerHTML =

                '<div class="caricamento">' +

                '📷 In attesa di una nuova scansione...' +

                '</div>';


            document.getElementById(
                "nuovaScansione"
            ).style.display =
                "none";


            document.getElementById(
                "reader"
            ).innerHTML =
                "";


            setTimeout(
                avviaScanner,
                300
            );

        }


        /*
        ==================================================
        AVVIO APPLICAZIONE
        ==================================================
        */

        async function avviaApplicazione() {


            /*
            1. Carichiamo Supabase
            */

            await caricaFrigo();


            /*
            2. Avviamo scanner
            */

            avviaScanner();


            /*
            3. Sincronizzazione ogni 5 secondi
            */

            setInterval(
                sincronizzaFrigo,
                5000
            );

        }


        /*
        ==================================================
        PARTENZA
        ==================================================
        */

        avviaApplicazione();


    </script>


</body>

</html>
